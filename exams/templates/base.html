{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam System</title>
    <!-- Tailwind CSS (Industry Standard Styling) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">
    <nav class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center sticky top-0 z-50 shadow-sm">
        <a href="{% url 'dashboard' %}" class="text-xl font-bold text-indigo-600 tracking-tight">Exam System</a>
        <div class="flex items-center space-x-6">
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}" class="text-gray-500 hover:text-indigo-600 font-medium transition">Dashboard</a>
                <form action="{% url 'logout' %}" method="post" class="m-0">
                    {% csrf_token %}
                    <button type="submit" class="text-gray-500 hover:text-red-500 font-medium transition">Logout ({{ user.username }})</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="text-gray-500 hover:text-indigo-600 font-medium transition">Login</a>
                <a href="{% url 'register' %}" class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-indigo-700 transition shadow-sm">Register</a>
            {% endif %}
        </div>
    </nav>
    
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>
    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
