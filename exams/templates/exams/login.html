{% extends 'base.html' %}
{% block content %}
<div class="min-h-[80vh] flex items-center justify-center">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-gray-100 p-8">
        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold text-gray-900">Welcome Back</h2>
            <p class="text-gray-500 text-sm mt-2">Please sign in to your account</p>
        </div>
        
        <form method="POST" class="space-y-5">
            {% csrf_token %}
            
            {% for field in form %}
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <p class="text-red-500 text-xs mt-1">{{ field.errors.0 }}</p>
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit" class="w-full bg-indigo-600 text-white py-2.5 rounded-lg font-medium hover:bg-indigo-700 transition shadow-sm mt-4">
                Sign In
            </button>
        </form>
        
        <p class="text-center text-sm text-gray-500 mt-6">
            Don't have an account? <a href="{% url 'register' %}" class="text-indigo-600 font-semibold hover:underline">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
